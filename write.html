<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write a post · Sarah Talks</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Pinyon+Script&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<header class="nav"><div class="wrap nav-in">
  <a href="index.html" class="brand"><img class="logo" src="assets/sarah-logo-trim.png" alt="Sarah Talks"></a>
  <nav class="nav-right">
    <div class="nav-links">
      <a href="blog.html">View Blog</a>
    </div>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" style="display:none">Log out</button>
    <button class="toggle" id="themeBtn" aria-label="Toggle theme"></button>
  </nav>
</div></header>

<main>
  <section style="padding-top:30px">
    <div class="wrap">

      <!-- LOGIN -->
      <div class="login-card" id="loginCard">
        <span class="eyebrow">Sarah only</span>
        <h2 style="margin:8px 0 4px">Sign in to publish</h2>
        <p class="muted" style="margin:0 0 18px;font-size:.95rem">Use your BB Bible app login.</p>
        <div class="ed-field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="you@example.com"></div>
        <div class="ed-field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
        <div class="ed-actions">
          <button class="btn btn-primary" id="loginBtn">Sign in</button>
          <span class="ed-note" id="loginNote"></span>
        </div>
      </div>

      <!-- EDITOR -->
      <div class="editor-wrap" id="editor" style="display:none">
        <div class="sec-head" style="text-align:left;margin-bottom:18px">
          <span class="eyebrow" id="edEyebrow">Write a post</span>
          <h1 style="font-size:clamp(1.9rem,5vw,2.6rem);margin:8px 0 0" id="edTitleHead">Write a post</h1>
        </div>

        <!-- Post picker: choose anything to edit -->
        <div class="draft-list" id="drafts"></div>

        <input type="hidden" id="postId">
        <div class="ed-field">
          <label>Title</label>
          <input id="fTitle" placeholder="e.g. The Drew flip explained, Night 34 feeds">
        </div>
        <div class="ed-row">
          <div class="ed-field"><label>Tag (optional)</label><input id="fTag" placeholder="Live Feeds"></div>
          <div class="ed-field"><label>Cover image URL (optional)</label><input id="fCover" placeholder="https://…"></div>
        </div>
        <div class="ed-field">
          <label>Short summary (optional)</label>
          <input id="fExcerpt" placeholder="One line that shows on the blog card.">
        </div>
        <div class="ed-field">
          <label>Body</label>
          <textarea id="fBody" placeholder="Write it like you talk.

Blank line = new paragraph.
## Big heading
- bullet point
**bold**  *italic*  [link text](https://…)"></textarea>
        </div>
        <p class="ed-hint">Formatting: blank line = new paragraph · <b>## Heading</b> · <b>- bullet</b> · <b>**bold**</b> · <b>*italic*</b> · <b>[text](link)</b></p>

        <div class="ed-actions">
          <button class="btn btn-ghost" id="saveDraftBtn">Save draft</button>
          <button class="btn btn-primary" id="publishBtn">Publish live</button>
          <button class="btn btn-ghost btn-sm" id="newBtn" style="display:none">+ New post</button>
          <span class="ed-note" id="edNote"></span>
        </div>
      </div>

    </div>
  </section>
</main>

<script src="app.js?v=4"></script>
<script src="blog.js?v=4"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var loginCard=$('loginCard'), editor=$('editor'), logoutBtn=$('logoutBtn');
  function note(el,msg,ok){ el.textContent=msg; el.style.color = ok? 'var(--sage)':'var(--rasp)'; }

  // A post id/slug to auto-open once we're authenticated (from ?edit=…).
  var params = new URLSearchParams(location.search);
  var pendingEdit = params.get('edit');

  function showEditor(on){
    loginCard.style.display = on ? 'none':'block';
    editor.style.display = on ? 'block':'none';
    logoutBtn.style.display = on ? 'inline-flex':'none';
    if(on) loadDrafts();
  }
  // Session died (expired token, no refresh): bounce back to the login screen.
  function sessionExpired(){
    Blog.logout();
    showEditor(false);
    note($('loginNote'), 'Your session expired. Please sign in again.', false);
  }

  // ---- login ----
  $('loginBtn').addEventListener('click', function(){
    var b=this; b.disabled=true; note($('loginNote'),'Signing in…',true);
    Blog.login($('email').value.trim(), $('password').value)
      .then(function(){ note($('loginNote'),'',true); showEditor(true); })
      .catch(function(e){ note($('loginNote'), e.message || 'Login failed', false); })
      .finally(function(){ b.disabled=false; });
  });
  $('password').addEventListener('keydown', function(e){ if(e.key==='Enter') $('loginBtn').click(); });
  logoutBtn.addEventListener('click', function(){ Blog.logout(); showEditor(false); });

  // ---- form state ----
  function clearForm(){
    $('postId').value=''; $('fTitle').value=''; $('fTag').value='';
    $('fCover').value=''; $('fExcerpt').value=''; $('fBody').value='';
    $('edEyebrow').textContent='New post'; $('edTitleHead').textContent='Write a post';
    $('newBtn').style.display='none';
    note($('edNote'),'',true);
  }
  $('newBtn').addEventListener('click', clearForm);

  function collect(published){
    var title=$('fTitle').value.trim();
    if(!title){ note($('edNote'),'Add a title first.',false); return null; }
    if(!$('fBody').value.trim()){ note($('edNote'),'Write something in the body.',false); return null; }
    return {
      title:title, tag:$('fTag').value.trim()||null, cover_url:$('fCover').value.trim()||null,
      excerpt:$('fExcerpt').value.trim()||null, body:$('fBody').value, published:!!published
    };
  }

  function save(published){
    var data=collect(published); if(!data) return;
    var id=$('postId').value;
    note($('edNote'), published?'Publishing…':'Saving…', true);
    var p;
    if(id){ p=Blog.update(id, data); }
    else { data.slug=Blog.slugify(data.title); p=Blog.create(data); }
    p.then(function(res){
      if(!res.ok){
        var msg=(res.body && (res.body.message||res.body.hint)) || ('Error '+res.status);
        if(res.status===401||res.status===403){ sessionExpired(); return; }
        if(String(res.body && res.body.code)==='23505') msg='A post with a very similar title exists, tweak the title.';
        note($('edNote'), msg, false); return;
      }
      var row = Array.isArray(res.body)? res.body[0] : res.body;
      if(row && row.id){ $('postId').value=row.id; $('edEyebrow').textContent='Editing'; $('edTitleHead').textContent=row.title; $('newBtn').style.display='inline-flex'; }
      note($('edNote'), published?'Published, it’s live on the blog!':'Draft saved.', true);
      loadDrafts();
    }).catch(function(e){
      if(e && e.auth){ sessionExpired(); return; }
      note($('edNote'),'Network error, try again.',false);
    });
  }
  $('saveDraftBtn').addEventListener('click', function(){ save(false); });
  $('publishBtn').addEventListener('click', function(){ save(true); });

  // ---- post picker (choose anything to edit) ----
  function loadDrafts(){
    var box=$('drafts');
    box.innerHTML='<p class="muted" style="margin:0 0 6px">Loading your posts…</p>';
    Blog.myPosts().then(function(rows){
      if(!Array.isArray(rows)) rows=[];
      var head='<div class="picker-head"><h3>Your posts</h3><button class="btn btn-ghost btn-sm" id="pickNew">+ Write a new post</button></div>';
      if(!rows.length){ box.innerHTML=head+'<p class="muted" style="text-align:center;margin:8px 0 0">No posts yet, your first one goes here.</p>'; }
      else {
        box.innerHTML = head + rows.map(function(r){
          var badge = r.published? '<span class="badge-live">LIVE</span>':'<span class="badge-draft">DRAFT</span>';
          return '<div class="draft-row"><div class="grow"><b>'+Blog.esc(r.title)+'</b><small>'+badge+' · '+Blog.esc(r.slug)+'</small></div>'
            + '<button class="btn btn-primary btn-sm" data-edit="'+r.id+'">Edit</button></div>';
        }).join('');
      }
      $('pickNew').addEventListener('click', function(){ clearForm(); $('fTitle').focus(); window.scrollTo({top:$('fTitle').offsetTop-120,behavior:'smooth'}); });
      Array.prototype.forEach.call(box.querySelectorAll('[data-edit]'), function(btn){
        btn.addEventListener('click', function(){ openPost(btn.getAttribute('data-edit')); });
      });
      // Fulfil a ?edit=… deep link now that the session is confirmed good.
      if(pendingEdit){ var want=pendingEdit; pendingEdit=null; openPost(want, true); }
    }).catch(function(e){
      if(e && e.auth){ sessionExpired(); return; }
      box.innerHTML='<p class="muted" style="text-align:center">Could not load your posts. <a href="write.html">Retry</a></p>';
    });
  }

  function fill(p){
    if(!p){ note($('edNote'),'That post could not be found.',false); return; }
    $('postId').value=p.id; $('fTitle').value=p.title||''; $('fTag').value=p.tag||'';
    $('fCover').value=p.cover_url||''; $('fExcerpt').value=p.excerpt||''; $('fBody').value=p.body||'';
    $('edEyebrow').textContent='Editing'; $('edTitleHead').textContent=p.title; $('newBtn').style.display='inline-flex';
    note($('edNote'), p.published?'Editing a LIVE post — Publish saves changes.':'Editing a draft.', true);
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function openPost(idOrSlug, bySlug){
    Blog.getForEdit(idOrSlug, !!bySlug).then(fill).catch(function(e){
      if(e && e.auth){ sessionExpired(); return; }
      note($('edNote'),'Could not open that post.',false);
    });
  }

  // boot
  showEditor(Blog.isLoggedIn());
})();
</script>
</body>
</html>
